<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Organizer — Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="dashboard-page">

  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
        <rect width="48" height="48" rx="10" fill="#4F46E5"/>
        <path d="M8 16L24 28L40 16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="8" y="14" width="32" height="22" rx="3" stroke="white" stroke-width="2.5" fill="none"/>
      </svg>
      <span class="topbar-title">Email Organizer</span>
    </div>
    <div class="topbar-right">
      <button class="btn-refresh" id="btn-refresh" title="Refresh emails">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Refresh
      </button>
      <div class="user-menu" id="user-menu">
        <img class="user-avatar" id="user-avatar" src="" alt="Avatar" />
        <span class="user-name" id="user-name"></span>
        <div class="user-dropdown">
          <a href="/auth/logout" class="dropdown-item">Sign out</a>
        </div>
      </div>
    </div>
  </header>

  <div class="app-layout">

    <!-- Sidebar: Categories -->
    <aside class="sidebar">
      <div class="sidebar-header">Inbox</div>
      <nav class="category-nav" id="category-nav">
        <button class="category-item active" data-category="all">
          <span class="cat-icon">📬</span>
          <span class="cat-label">All Emails</span>
          <span class="cat-count" id="count-all">0</span>
        </button>
        <button class="category-item" data-category="urgent">
          <span class="cat-icon">🔴</span>
          <span class="cat-label">Urgent</span>
          <span class="cat-count" id="count-urgent">0</span>
        </button>
        <button class="category-item" data-category="work">
          <span class="cat-icon">💼</span>
          <span class="cat-label">Work</span>
          <span class="cat-count" id="count-work">0</span>
        </button>
        <button class="category-item" data-category="personal">
          <span class="cat-icon">👤</span>
          <span class="cat-label">Personal</span>
          <span class="cat-count" id="count-personal">0</span>
        </button>
        <button class="category-item" data-category="finance">
          <span class="cat-icon">💳</span>
          <span class="cat-label">Finance</span>
          <span class="cat-count" id="count-finance">0</span>
        </button>
        <button class="category-item" data-category="newsletters">
          <span class="cat-icon">📰</span>
          <span class="cat-label">Newsletters</span>
          <span class="cat-count" id="count-newsletters">0</span>
        </button>
        <button class="category-item" data-category="social">
          <span class="cat-icon">💬</span>
          <span class="cat-label">Social</span>
          <span class="cat-count" id="count-social">0</span>
        </button>
        <button class="category-item" data-category="spam">
          <span class="cat-icon">🚫</span>
          <span class="cat-label">Spam</span>
          <span class="cat-count" id="count-spam">0</span>
        </button>
        <button class="category-item" data-category="other">
          <span class="cat-icon">📂</span>
          <span class="cat-label">Other</span>
          <span class="cat-count" id="count-other">0</span>
        </button>
      </nav>

      <div class="sidebar-divider"></div>

      <div class="sidebar-section-header">
        <span>Custom Labels</span>
      </div>

      <nav class="category-nav" id="custom-category-nav">
        <!-- Populated by JS -->
      </nav>

      <div class="add-label-area" id="add-label-area">
        <button class="btn-add-label" id="btn-add-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          New Label
        </button>
        <form class="add-label-form" id="add-label-form" style="display:none">
          <input
            type="text"
            class="add-label-input"
            id="add-label-input"
            placeholder="Label name…"
            maxlength="40"
            autocomplete="off"
          />
          <div class="add-label-btns">
            <button type="submit" class="btn-label-save" id="btn-label-save">Add</button>
            <button type="button" class="btn-label-cancel" id="btn-label-cancel">Cancel</button>
          </div>
        </form>
      </div>

      <div class="sidebar-status" id="sidebar-status"></div>
    </aside>

    <!-- Email List -->
    <main class="email-list-panel" id="email-list-panel">
      <div class="panel-header">
        <h2 class="panel-title" id="panel-title">All Emails</h2>
        <span class="panel-subtitle" id="panel-subtitle"></span>
      </div>

      <div class="cat-error-banner" id="cat-error-banner" style="display:none"></div>

      <div class="loading-state" id="loading-state">
        <div class="spinner"></div>
        <p id="loading-text">Loading your emails…</p>
      </div>

      <div class="empty-state" id="empty-state" style="display:none">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <rect x="8" y="16" width="48" height="36" rx="4" stroke="#CBD5E1" stroke-width="2"/>
          <path d="M8 24L32 40L56 24" stroke="#CBD5E1" stroke-width="2"/>
        </svg>
        <p>No emails in this category</p>
      </div>

      <div class="email-list" id="email-list" style="display:none"></div>
    </main>

    <!-- Email Detail Panel -->
    <section class="email-detail-panel" id="email-detail-panel">
      <div class="detail-placeholder" id="detail-placeholder">
        <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
          <rect x="10" y="18" width="52" height="38" rx="5" stroke="#CBD5E1" stroke-width="2"/>
          <path d="M10 28L36 44L62 28" stroke="#CBD5E1" stroke-width="2"/>
          <path d="M22 56L22 62M36 56L36 62M50 56L50 62" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <p>Select an email to read it</p>
      </div>

      <div class="detail-content" id="detail-content" style="display:none">
        <div class="detail-header">
          <div class="detail-meta">
            <h2 class="detail-subject" id="detail-subject"></h2>
            <div class="detail-info">
              <span class="detail-from" id="detail-from"></span>
              <span class="detail-date" id="detail-date"></span>
            </div>
            <div class="detail-category-badge" id="detail-category-badge"></div>
          </div>
          <button class="detail-close" id="detail-close" title="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <div class="detail-body" id="detail-body"></div>

        <div class="detail-actions">
          <button class="btn-ai btn-summarize" id="btn-summarize">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            Summarize
          </button>
          <button class="btn-ai btn-draft" id="btn-draft">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
            Draft Reply
          </button>
        </div>

        <!-- AI Summary -->
        <div class="ai-panel" id="summary-panel" style="display:none">
          <div class="ai-panel-header">
            <span class="ai-label">✨ AI Summary</span>
            <button class="ai-close" data-panel="summary-panel">✕</button>
          </div>
          <div class="ai-panel-body" id="summary-text"></div>
        </div>

        <!-- AI Draft Reply -->
        <div class="ai-panel" id="draft-panel" style="display:none">
          <div class="ai-panel-header">
            <span class="ai-label">✍️ AI Draft Reply</span>
            <div class="ai-panel-actions">
              <button class="btn-copy" id="btn-copy-draft">Copy</button>
              <button class="ai-close" data-panel="draft-panel">✕</button>
            </div>
          </div>
          <textarea class="draft-textarea" id="draft-text" rows="10" spellcheck="true"></textarea>
        </div>
      </div>
    </section>

  </div>

  <script src="/js/app.js"></script>
</body>
</html>
